name: Build GitBuild APK

on:
  push:
    paths:
      - 'source.zip'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Unpack source
        run: |
          rm -rf project
          mkdir project
          unzip -q source.zip -d project

      - name: Build debug APK
        run: gradle -p project :app:assembleDebug --stacktrace

      - name: Name APK
        run: |
          mkdir -p out
          VERSION=$(grep -m1 "versionName" project/app/build.gradle | sed -E "s/.*versionName[[:space:]]+'([^']+)'.*/\1/")
          cp project/app/build/outputs/apk/debug/app-debug.apk "out/GitBuild_${VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk
          if-no-files-found: error
