name: Build GitBuild APK

on:
  push:
    paths:
      - 'source.zip'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  REPO_NAME: GitBuild

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK 36
        shell: bash
        run: |
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Unpack source
        shell: bash
        run: |
          rm -rf project
          mkdir project
          unzip -q source.zip -d project

      - name: Build debug APK
        run: gradle --no-daemon -p project :app:assembleDebug --stacktrace

      - name: Name APK
        shell: bash
        run: |
          mkdir -p out
          VERSION=$(sed -nE "s/.*versionName[[:space:]]+['\"]([^'\"]+)['\"].*/\1/p" project/app/build.gradle | head -n1)
          [ -n "$VERSION" ] || VERSION="unknown"
          cp project/app/build/outputs/apk/debug/app-debug.apk "out/GitBuild_${VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk
          if-no-files-found: error
